# Publish the dashboard to the Hugging Face Space when it changes on main.
# Needs repository secret HF_TOKEN (write access) and variable HF_SPACE, for example dsoosai/crm-scoring-agents.
name: space
on:
  push:
    branches: [main]
    paths: ["space/**"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          rid = os.environ.get("HF_SPACE") or "dsoosai/crm-scoring-agents"
          api.create_repo(rid, repo_type="space", space_sdk="static", exist_ok=True)
          api.upload_folder(folder_path="space", repo_id=rid, repo_type="space")
          print(f"https://huggingface.co/spaces/{rid}")
          PY
