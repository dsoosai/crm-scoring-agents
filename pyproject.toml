[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-scoring-agents"
version = "0.1.0"
description = "Agent lifecycle management for CRM lead and account scoring: drift, fine-tuning, gated promotion, Salesforce write-back, MCP and A2A."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel Soosai" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "duckdb>=1.0",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "mcp>=1.2",
]

[project.optional-dependencies]
salesforce = ["simple-salesforce>=1.12"]
snowflake = ["snowflake-connector-python[pandas]>=3.12"]
llm = ["anthropic>=0.40", "huggingface_hub>=0.26"]
dev = ["pytest>=8"]
all = ["crm-scoring-agents[salesforce,snowflake,llm,dev]"]

[project.scripts]
crm-agent = "crmscore.cli:main"

[tool.setuptools.packages.find]
include = ["crmscore*"]

[tool.setuptools.package-data]
crmscore = ["dashboard_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
